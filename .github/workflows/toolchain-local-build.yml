name: toolchain-local-build
on:
  push:
    branches:
      - toolchain-local-build-20261003

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ./configure
          make -j2
          ./pasmo --help >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pasmo-linux
          path: pasmo
          if-no-files-found: error
